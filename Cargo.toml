[package]
name = "purview"
version = "0.1.0"
edition = "2021"
description = "Codebase-first code review — the diff is an overlay on the repo, not the unit of work."

[dependencies]
eframe = "0.30"
egui = "0.30"
# default-features off drops the https/ssh transport (and its openssl-sys
# + pkg-config build deps). We only diff local repos — no network transport.
git2 = { version = "0.19", default-features = false }
# Syntax highlighting (Sublime-grade). default-features off avoids the
# onig C dependency; the fancy-regex pure-Rust engine works fine for us.
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = "0.5"
egui_kittest = "0.30"

[[bench]]
name = "perf"
harness = false

[profile.release]
opt-level = 3
lto = true
